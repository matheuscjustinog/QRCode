<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de QR Code Local</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full py-6 px-6 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">QR Code Studio</h1>
                    <p class="text-xs text-slate-400">100% Local & Client-Side (Sem APIs)</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center space-x-2 text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Processamento no Navegador</span>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Controles -->
        <div class="lg:col-span-7 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm space-y-6">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-4 flex items-center space-x-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Configurações do QR Code</span>
            </h2>

            <!-- URL -->
            <div class="space-y-2">
                <label for="urlInput" class="text-sm font-medium text-slate-300 block">Link ou Conteúdo (URL)</label>
                <div class="relative">
                    <input type="text" id="urlInput" value="https://github.com" placeholder="Digite ou cole seu link aqui..." 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm">
                </div>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Cores -->
                <div class="space-y-2 bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Cor do QR Code</label>
                    <div class="flex items-center space-x-3">
                        <input type="color" id="fgColor" value="#000000" class="w-10 h-10 rounded-lg bg-transparent cursor-pointer border border-slate-700">
                        <span id="fgColorText" class="text-xs font-mono text-slate-400">#000000</span>
                    </div>
                </div>

                <div class="space-y-2 bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Cor de Fundo</label>
                    <div class="flex items-center space-x-3">
                        <input type="color" id="bgColor" value="#ffffff" class="w-10 h-10 rounded-lg bg-transparent cursor-pointer border border-slate-700">
                        <span id="bgColorText" class="text-xs font-mono text-slate-400">#ffffff</span>
                    </div>
                </div>
            </div>

            <!-- Reed Solomon e Tamanho -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2 bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <label for="errorCorrection" class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Correção de Erros</label>
                    <select id="errorCorrection" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="L">Baixa (~7%)</option>
                        <option value="M" selected>Média (~15%)</option>
                        <option value="Q">Quartil (~25%)</option>
                        <option value="H">Alta (~30%)</option>
                    </select>
                </div>

                <div class="space-y-2 bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                    <label for="qrSize" class="text-xs font-semibold uppercase tracking-wider text-slate-400 block">Resolução (Pixels)</label>
                    <select id="qrSize" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="200">200 x 200 px</option>
                        <option value="300" selected>300 x 300 px</option>
                        <option value="400">400 x 400 px</option>
                        <option value="600">600 x 600 px</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Preview -->
        <div class="lg:col-span-5 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm flex flex-col items-center justify-center space-y-6">
            <h2 class="text-lg font-semibold text-slate-200 w-full border-b border-slate-800 pb-4 text-center">Visualização</h2>

            <!-- Container QR -->
            <div id="qrcodeContainer" class="p-6 bg-white rounded-2xl shadow-inner flex items-center justify-center min-h-[250px] min-w-[250px] transition-all transform hover:scale-[1.02]">
                <!-- QR code gera aqui -->
            </div>

            <!-- Botão de Download -->
            <button id="downloadBtn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Baixar QR Code (PNG)</span>
            </button>
        </div>

    </main>

    <!-- Feedback -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 text-sm">
        <svg class="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg">Operação realizada com sucesso!</span>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-900">
        Gerador de QR Code Client-Side &bull; Criado com JavaScript puro &amp; Tailwind CSS
    </footer>

    <!-- Logica -->
    <script>
        // DOM
        const urlInput = document.getElementById('urlInput');
        const fgColorPicker = document.getElementById('fgColor');
        const bgColorPicker = document.getElementById('bgColor');
        const fgColorText = document.getElementById('fgColorText');
        const bgColorText = document.getElementById('bgColorText');
        const errorCorrectionSelect = document.getElementById('errorCorrection');
        const qrSizeSelect = document.getElementById('qrSize');
        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function generateQRCode() {
            const text = urlInput.value.trim() || 'https://github.com';
            const fgColor = fgColorPicker.value;
            const bgColor = bgColorPicker.value;
            const errorCorrection = errorCorrectionSelect.value;
            const targetSize = parseInt(qrSizeSelect.value);

            fgColorText.textContent = fgColor;
            bgColorText.textContent = bgColor;

            // Limpar Container
            qrcodeContainer.innerHTML = '';

            try {
                const typeNumber = 0; 
                let errorCorrectLevel = QecLevelMap(errorCorrection);

                const qr = qrcode(typeNumber, errorCorrectLevel);
                qr.addData(text);
                qr.make();

                const moduleCount = qr.getModuleCount();
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = targetSize;
                canvas.height = targetSize;

                const cellSize = targetSize / moduleCount;

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, targetSize, targetSize);

                ctx.fillStyle = fgColor;
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        if (qr.isDark(row, col)) {
                            const w = Math.ceil((col + 1) * cellSize) - Math.floor(col * cellSize);
                            const h = Math.ceil((row + 1) * cellSize) - Math.floor(row * cellSize);
                            ctx.fillRect(Math.round(col * cellSize), Math.round(row * cellSize), w, h);
                        }
                    }
                }

                canvas.style.maxWidth = '100%';
                canvas.style.height = 'auto';
                canvas.style.borderRadius = '8px';
                qrcodeContainer.appendChild(canvas);

            } catch (e) {
                console.error(e);
                qrcodeContainer.innerHTML = '<span class="text-xs text-rose-500 font-medium">Texto muito longo para a versão atual.</span>';
            }
        }

        function QecLevelMap(level) {
            return level; 
        }

        // Event Listeners
        urlInput.addEventListener('input', generateQRCode);
        fgColorPicker.addEventListener('input', generateQRCode);
        bgColorPicker.addEventListener('input', generateQRCode);
        errorCorrectionSelect.addEventListener('change', generateQRCode);
        qrSizeSelect.addEventListener('change', generateQRCode);

        // Download
        downloadBtn.addEventListener('click', () => {
            const canvas = qrcodeContainer.querySelector('canvas');
            if (!canvas) {
                showToast('Nenhum QR code gerado para download.');
                return;
            }

            const link = document.createElement('a');
            link.download = 'qrcode-personalizado.png';
            link.href = canvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('QR Code baixado com sucesso!');
        });

        window.onload = generateQRCode;
    </script>
</body>
</html>
